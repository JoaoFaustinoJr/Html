<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff5aa5"><title>Atualizando Tia Tati Kids</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(145deg,#f4fbff,#fff2f8);color:#154f9f}body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{width:min(430px,100%);background:#fff;border-radius:28px;padding:26px;text-align:center;box-shadow:0 16px 40px rgba(31,79,123,.14)}.heart{font-size:48px}.box h1{margin:8px 0 6px;font-size:24px}.box p{margin:0;color:#62758b;line-height:1.5}</style><script>(()=>{const go=()=>location.replace('./?v=5&fresh='+Date.now());setTimeout(go,3500);(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/tia-tati-kids/')).map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('tia-tati-kids-')).map(k=>caches.delete(k)));}if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.register('./sw.js?v=5&fresh='+Date.now(),{scope:'./',updateViaCache:'none'});try{await reg.update();}catch(_){}}}catch(_){ }go();})();})();</script></head><body><div class="box"><div class="heart">💗</div><h1>Atualizando o Tia Tati Kids</h1><p>Restaurando a base funcional aprovada e aplicando apenas a identidade visual Kids.</p></div></body></html>
