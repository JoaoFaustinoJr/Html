<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff5aa5"><title>Atualizando Tia Tati Kids</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(145deg,#f4fbff,#fff2f8);color:#154f9f}body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{width:min(430px,100%);background:#fff;border-radius:28px;padding:26px;text-align:center;box-shadow:0 16px 40px rgba(31,79,123,.14)}.heart{font-size:48px}.box h1{margin:8px 0 6px;font-size:24px}.box p{margin:0;color:#62758b;line-height:1.5}.bar{height:8px;border-radius:99px;background:#edf3f8;overflow:hidden;margin:20px 0 8px}.bar i{display:block;height:100%;width:45%;border-radius:99px;background:linear-gradient(90deg,#ff5aa5,#64cfff);animation:go 1.1s ease-in-out infinite}@keyframes go{0%{transform:translateX(-110%)}100%{transform:translateX(245%)}}</style><script>(()=>{const go=()=>location.replace('./?v=6&fresh='+Date.now());const timeout=setTimeout(go,3500);(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/tia-tati-kids/')).map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('tia-tati-kids-')).map(k=>caches.delete(k)));}}catch(_){}clearTimeout(timeout);go();})();})();</script></head><body><div class="box"><div class="heart">💗</div><h1>Tia Tati Kids v6</h1><p>Carregando a versão direta e estável do aplicativo.</p><div class="bar"><i></i></div></div></body></html>
