<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" role="img" aria-labelledby="title desc">
  <title id="title">Tia Tati jogando ping pong</title>
  <desc id="desc">Card da Tia Tati com mesa de ping pong, raquete e bola.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefaff"/>
      <stop offset="0.55" stop-color="#fff6fb"/>
      <stop offset="1" stop-color="#fff1f7"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39a9ea"/>
      <stop offset="1" stop-color="#197ac4"/>
    </linearGradient>
    <clipPath id="portraitClip"><rect x="20" y="18" width="270" height="294" rx="38"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#245a80" flood-opacity=".16"/></filter>
  </defs>
  <rect width="768" height="330" rx="34" fill="url(#bg)"/>
  <circle cx="690" cy="55" r="58" fill="#ffffff" opacity=".55"/>
  <circle cx="520" cy="76" r="34" fill="#dff4ff" opacity=".8"/>
  <g clip-path="url(#portraitClip)" filter="url(#shadow)">
    <rect x="20" y="18" width="270" height="294" rx="38" fill="#fff"/>
    <image href="../welcome.webp" x="16" y="10" width="282" height="306" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g transform="translate(252 22)">
    <path d="M40 92 C120 45 236 55 340 88" fill="none" stroke="#17afe9" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 13" opacity=".8"/>
    <circle cx="340" cy="88" r="18" fill="#fff" stroke="#e9f1f7" stroke-width="3" filter="url(#shadow)"/>
    <g transform="translate(18 84) rotate(-16)">
      <ellipse cx="0" cy="0" rx="42" ry="52" fill="#f2479a" stroke="#d92f82" stroke-width="4"/>
      <rect x="-7" y="42" width="14" height="54" rx="7" fill="#7d4a2b"/>
    </g>
    <g transform="translate(120 118)" filter="url(#shadow)">
      <polygon points="0,62 340,62 404,178 -70,178" fill="url(#table)" stroke="#fff" stroke-width="7"/>
      <line x1="166" y1="62" x2="165" y2="178" stroke="#fff" stroke-width="4" opacity=".9"/>
      <line x1="-42" y1="121" x2="374" y2="121" stroke="#fff" stroke-width="4" opacity=".9"/>
      <rect x="-10" y="55" width="356" height="18" rx="5" fill="#123f76"/>
      <g stroke="#fff" stroke-width="2" opacity=".8">
        <line x1="12" y1="57" x2="12" y2="71"/><line x1="35" y1="57" x2="35" y2="71"/><line x1="58" y1="57" x2="58" y2="71"/><line x1="81" y1="57" x2="81" y2="71"/><line x1="104" y1="57" x2="104" y2="71"/><line x1="127" y1="57" x2="127" y2="71"/><line x1="150" y1="57" x2="150" y2="71"/><line x1="173" y1="57" x2="173" y2="71"/><line x1="196" y1="57" x2="196" y2="71"/><line x1="219" y1="57" x2="219" y2="71"/><line x1="242" y1="57" x2="242" y2="71"/><line x1="265" y1="57" x2="265" y2="71"/><line x1="288" y1="57" x2="288" y2="71"/><line x1="311" y1="57" x2="311" y2="71"/>
      </g>
    </g>
  </g>
  <g transform="translate(320 28)">
    <rect width="240" height="72" rx="30" fill="#fff" opacity=".96" filter="url(#shadow)"/>
    <text x="120" y="43" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#0b4382">Vamos começar? 💗</text>
  </g>
  <text x="500" y="305" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#315c7a">Movimento também é saúde!</text>
</svg>