<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<title>Tangram Educativo — atualização</title>
<meta name="description" content="Esta versão do Tangram Educativo foi atualizada.">
<link rel="canonical" href="https://joaofaustinojr.github.io/Html/tangram-prof-junior-v12/">
<style>
html,body{margin:0;min-height:100%;background:#050f18;color:#eefaff;font-family:system-ui}
main{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}
.card{max-width:560px;padding:28px;border:1px solid #3d7589;border-radius:24px;background:#092233;box-shadow:0 20px 55px #0008}
h1{margin:0 0 12px;color:#9ff6e2}p{line-height:1.5;color:#cce8ef}.small{font-size:13px;color:#8eb6c2}
</style>
</head>
<body>
<main><div class="card">
<h1>🧩 Tangram Educativo</h1>
<p>Esta versão foi atualizada. Abrindo agora a versão mais recente do aplicativo…</p>
<p class="small">Se a página não mudar automaticamente, toque aqui: <a id="go" href="../tangram-prof-junior-v12/" style="color:#78e8ff">abrir versão atual</a>.</p>
</div></main>
<script>
(async()=>{
  const target=new URL('../tangram-prof-junior-v12/',location.href);
  target.hash=location.hash||'';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/tangram-prof-junior-v9/')).map(r=>r.unregister()));
    }
  }catch(_){}
  const go=document.getElementById('go');
  if(go)go.href=target.href;
  setTimeout(()=>location.replace(target.href),450);
})();
</script>
</body>
</html>
