<style>html,body{margin:0;min-height:100%;background:#050f18;color:#eefaff;font-family:system-ui}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}</style>
</head>
<body>
<div id="loading"><div><h1>🧩 Tangram Educativo</h1><p>Carregando desafio...</p></div></div>
<script>
(async()=>{
 try{
  const files=['chunk01.txt','chunk02-03.txt','chunk04-05.txt','chunk06-07.txt','chunk08-09.txt'];
  const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
  const b64=parts.join('').replace(/\s+/g,'');
  const bin=atob(b64);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  let page=new TextDecoder('utf-8').decode(bytes);

  page=page.replaceAll('Prof. Júnior','Prof. João Faustino Junior');
  page=page.replaceAll('Prof. Junior','Prof. João Faustino Junior');

  page=page.replace(
    /<div class="tl-head">\s*<div><h1>.*?<\/h1><div class="tl-sub">.*?<\/div><\/div>/s,
    `<div class="tl-head"><div class="tl-brand"><img class="tl-rai-brand" src="rai-chalk.webp" alt="R.A.I."><div><h1>🧩 Tangram Educativo</h1><div class="tl-sub">Prof. João Faustino Junior</div></div></div>`
  );

  const extraCss=`<style>
    .tl-brand{display:flex;align-items:center;gap:12px;min-width:0}
    .tl-rai-brand{width:74px;height:74px;object-fit:cover;border-radius:17px;border:1px solid #376b80;box-shadow:0 6px 16px rgba(0,0,0,.28);flex:0 0 auto}
    .tl-brand h1{margin:0}
    @media(max-width:640px){
      #tangram-levels{padding:7px!important}
      .tl-head{align-items:center!important;gap:8px!important}
      .tl-rai-brand{width:58px;height:58px;border-radius:14px}
      .tl-brand h1{font-size:19px!important;line-height:1.12}
      .tl-brand .tl-sub{font-size:12px!important}
      .tl-board-scroll{min-height:330px}
      .tl-mobile-controls{grid-template-columns:repeat(4,1fr)!important}
    }
    #tangram-levels.tl-focus{max-width:none!important;width:100%!important;height:100vh!important;min-height:100vh!important;margin:0!important;padding:4px!important;border-radius:0!important}
    #tangram-levels.tl-focus .tl-head,
    #tangram-levels.tl-focus .tl-side,
    #tangram-levels.tl-focus .tl-math,
    #tangram-levels.tl-focus .tl-legend{display:none!important}
    #tangram-levels.tl-focus .tl-layout{display:block!important}
    #tangram-levels.tl-focus .tl-stage{height:100vh!important;border-radius:0!important}
    #tangram-levels.tl-focus .tl-board-scroll{height:calc(100vh - 126px)!important;min-height:0!important}
    #tangram-levels.tl-focus .tl-board-scroll svg{width:100%!important;height:100%!important;max-height:none!important}
    #tangram-levels.tl-focus .tl-mobile-controls{display:grid!important;grid-template-columns:repeat(4,1fr)!important;position:sticky;bottom:0;z-index:20}
  </style>`;

  page=page.replace('</head>',extraCss+'</head>');

  page=page.replace(
    '<button class="tl-btn" id="sample" type="button" style="width:100%;margin-top:8px">👁️ Amostra de solução</button>',
    '<button class="tl-btn" id="sample" type="button" style="width:100%;margin-top:8px">👁️ Amostra de solução</button><button class="tl-btn primary" id="fullscreen" type="button" style="width:100%;margin-top:8px">⛶ Tela cheia</button>'
  );
  page=page.replace(
    '<button type="button" id="mCheck" aria-label="Verificar encaixe">✓<span>Verificar</span></button>',
    '<button type="button" id="mFull" aria-label="Tela cheia">⛶<span>Tela cheia</span></button><button type="button" id="mCheck" aria-label="Verificar encaixe">✓<span>Verificar</span></button>'
  );

  const focusScript=`<script>
  (()=>{
    const root=document.getElementById('tangram-levels');
    const buttons=[document.getElementById('fullscreen'),document.getElementById('mFull')].filter(Boolean);
    if(!root||!buttons.length)return;
    const update=()=>{
      const on=root.classList.contains('tl-focus')||document.fullscreenElement===root;
      const a=document.getElementById('fullscreen');
      const b=document.getElementById('mFull');
      if(a)a.textContent=on?'🗗 Sair da tela cheia':'⛶ Tela cheia';
      if(b)b.innerHTML=on?'🗗<span>Sair</span>':'⛶<span>Tela cheia</span>';
    };
    const toggle=async()=>{
      if(root.classList.contains('tl-focus')||document.fullscreenElement===root){
        root.classList.remove('tl-focus');
        if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}
        if(screen.orientation&&screen.orientation.unlock){try{screen.orientation.unlock()}catch(e){}}
        update(); return;
      }
      let native=false;
      if(root.requestFullscreen){
        try{await root.requestFullscreen({navigationUI:'hide'});native=true}catch(e){}
      }
      if(!native)root.classList.add('tl-focus');
      if(screen.orientation&&screen.orientation.lock){try{await screen.orientation.lock('landscape')}catch(e){}}
      update();
    };
    buttons.forEach(b=>b.addEventListener('click',toggle));
    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement)root.classList.remove('tl-focus');
      update();
    });
    update();
  })();
  <\/script>`;

  page=page.replace('</body>',focusScript+'</body>');
  document.open();document.write(page);document.close();
 }catch(e){document.getElementById('loading').innerHTML='<div><h1>🧩 Tangram Educativo</h1><p>Não foi possível carregar o jogo. Atualize a página.</p></div>'}
})();
</script>
</body>
</html>
