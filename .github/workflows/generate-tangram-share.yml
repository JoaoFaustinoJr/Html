name: Generate Tangram share card
on:
  push:
    paths:
      - 'scripts/generate_tangram_share.py'
      - '.github/workflows/generate-tangram-share.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/generate_tangram_share.py
      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tangram-prof-junior-v12/tangram-share-final.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza card final de compartilhamento"
          git push
