name: Tia Tati Card Preview

on:
  push:
    paths:
      - 'tia-tati/assets/card-tia-tati.webp'
      - '.github/workflows/tia-tati-card-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-card-jpg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Convert official WebP card to baseline JPEG
        run: |
          python - <<'PY'
          from PIL import Image
          src='tia-tati/assets/card-tia-tati.webp'
          dst='tia-tati/assets/card-tia-tati.jpg'
          img=Image.open(src).convert('RGB')
          img.save(dst,'JPEG',quality=91,optimize=True,progressive=False,subsampling=0)
          print('saved', dst, img.size)
          PY
          file tia-tati/assets/card-tia-tati.jpg

      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tia-tati/assets/card-tia-tati.jpg
          if git diff --cached --quiet; then
            echo "Card JPEG já está atualizado."
          else
            git commit -m "Tia Tati: corrige JPEG do card social"
            git push
          fi
