name: Tia Tati Card Preview

on:
  push:
    paths:
      - 'tia-tati/assets/card-tia-tati-lite.b64.txt'
      - '.github/workflows/tia-tati-card-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-card-jpg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode JPEG preview
        run: |
          base64 -d tia-tati/assets/card-tia-tati-lite.b64.txt > tia-tati/assets/card-tia-tati.jpg
          file tia-tati/assets/card-tia-tati.jpg

      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tia-tati/assets/card-tia-tati.jpg
          if git diff --cached --quiet; then
            echo "Card JPEG já está atualizado."
          else
            git commit -m "Tia Tati: gera card JPEG para preview social"
            git push
          fi
