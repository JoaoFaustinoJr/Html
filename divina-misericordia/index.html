<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151314"><title>Novena da Divina Misericórdia</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--red:#8f1d25;--ink:#201b1a;--ivory:#f6f0e5;--gold:#b69762;--pale:#d9e9ef;--day:1}*{box-sizing:border-box}body{margin:0;background:#111;color:var(--ivory);font-family:Georgia,serif}.app{min-height:100vh;background:radial-gradient(circle at 50% 25%,rgba(255,255,255,calc(.025 * var(--day))),transparent 32%),linear-gradient(145deg,#0e1012,#231719 65%,#101214);position:relative;overflow:hidden}.ray{position:fixed;top:8vh;left:50%;width:18vw;height:115vh;transform-origin:top;filter:blur(10px);pointer-events:none;opacity:calc(.13 + .055 * var(--day));z-index:0}.r1{background:linear-gradient(#fff0,rgba(224,242,248,.65));transform:rotate(15deg)}.r2{background:linear-gradient(#fff0,rgba(180,22,34,.72));transform:rotate(-15deg);margin-left:-18vw}header,main,nav{position:relative;z-index:2}header{text-align:center;padding:34px 18px 20px}.kicker{letter-spacing:.18em;color:#d7c29b;font-size:.72rem}.title{font-size:clamp(2rem,8vw,3.6rem);margin:.25em 0;color:#fff}.polish{font-style:italic;color:#e8d7bd;font-size:1.25rem}.sub{max-width:620px;margin:8px auto;color:#d6cfca;line-height:1.5}.days{display:flex;gap:8px;overflow:auto;padding:12px 16px 18px;scrollbar-width:none}.days button{min-width:62px;border:1px solid #6c5552;background:#211b1c;color:#eee;border-radius:14px;padding:10px 7px}.days button.active{background:var(--red);border-color:#d59a9e}.card{max-width:760px;margin:0 auto 90px;background:rgba(247,241,230,.96);color:var(--ink);border-radius:24px 24px 0 0;padding:26px 22px 40px;box-shadow:0 -10px 50px #0008}.card h2{color:var(--red);font-size:1.75rem;margin:.2em 0}.theme{font-style:italic;color:#76645b;margin-bottom:20px}.section{border-top:1px solid #d8c9b5;padding-top:15px;margin-top:17px}.section h3{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;color:#8a2a30}.section p{line-height:1.65}.quote{font-style:italic;border-left:3px solid var(--gold);padding-left:14px}.refrain{text-align:center;color:var(--red);font-weight:bold;font-style:italic;font-size:1.08rem;margin:24px 0}.chaplet{background:#efe4d4;border-radius:16px;padding:16px}.chaplet ol{padding-left:22px;line-height:1.55}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#151314ee;border-top:1px solid #4d3938;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:#e8ded4;font:12px Georgia;padding:8px}.progress{height:3px;background:#3c3130}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pale),var(--red));width:11%}@media(min-width:800px){.card{border-radius:24px;margin-bottom:100px}.days{justify-content:center}}</style></head><body><div class="app" id="app"><div class="ray r1"></div><div class="ray r2"></div><header><div class="kicker">COM SANTA FAUSTINA E SÃO JOÃO PAULO II</div><div class="title">Divina Misericórdia</div><div class="polish">Jezu, ufam Tobie.</div><div class="sub">Nove dias para contemplar, confiar e deixar que a Misericórdia de Cristo ilumine a vida.</div></header><div class="progress"><i id="bar"></i></div><div class="days" id="days"></div><main class="card" id="content"></main><nav class="nav"><button onclick="go(-1)">‹ Anterior</button><button onclick="scrollTo({top:0,behavior:'smooth'})">✝ Início</button><button onclick="go(1)">Próximo ›</button></nav></div><script>const D=[
['O rosto da Misericórdia','Toda a humanidade, especialmente os pecadores','Lc 15,1-7','A Misericórdia não é uma ideia abstrata. Em Cristo, Deus se inclina sobre a fragilidade humana, procura quem se perdeu e abre um caminho de retorno. Começamos a novena não olhando para nossa força, mas para o Coração que nos espera.','Hoje, apresentarei a Jesus minha vida sem esconder minhas fraquezas.'],
['Jesus, eu confio em Vós','Sacerdotes e religiosos','Jo 20,19-23','Confiar não é ignorar a dor; é colocá-la nas mãos de Deus. Santa Faustina fez da confiança uma resposta cotidiana. São João Paulo II testemunhou essa mesma esperança em uma Polônia marcada pela guerra e pela opressão.','Rezarei por um sacerdote ou consagrado e confiarei a Deus uma preocupação concreta.'],
['Das feridas nasce a Misericórdia','Todas as almas piedosas e fiéis','Jo 19,31-37','Os raios conduzem ao lado aberto de Cristo. O vermelho recorda o Sangue; o pálido, a Água. A misericórdia cristã não contorna a Cruz: nasce do amor que se entrega até o fim e transforma a ferida em fonte de vida.','Farei um gesto de gratidão por um sacramento recebido.'],
['Misericórdia para quem está longe','Os que não creem em Deus e os que ainda não conhecem Cristo','Lc 15,11-32','O Pai não deixa de amar o filho distante. A missão não começa pela condenação, mas pelo desejo de que cada pessoa encontre a verdade e a alegria de voltar para casa.','Rezarei com respeito por alguém distante da fé.'],
['Misericórdia que reconcilia','Os que se afastaram da unidade da Igreja','Jo 17,20-23','A misericórdia aproxima sem apagar a verdade. Reconciliação exige humildade, escuta, perdão e desejo sincero de unidade. Em Cristo, a verdade e o amor não competem.','Darei um primeiro passo para reparar uma relação ferida.'],
['Pequenez, humildade e confiança','As almas mansas e humildes e as crianças','Mt 11,25-30','Deus encontra espaço no coração que não precisa fingir grandeza. A humildade de Faustina lembra que uma vida escondida pode tornar-se instrumento de uma obra muito maior que ela.','Praticarei um serviço escondido, sem esperar reconhecimento.'],
['Testemunhas da Misericórdia','Os que veneram e glorificam de modo especial a Misericórdia de Deus','Mt 5,7','Receber misericórdia cria responsabilidade. João Paulo II pediu que a mensagem de Łagiewniki alcançasse o mundo. A fé se torna visível quando nossas palavras e obras carregam a mesma compaixão que pedimos a Deus.','Farei uma obra concreta de misericórdia.'],
['Esperança que não morre','As almas do purgatório','Jo 11,21-27','A misericórdia alcança também nossa oração pelos que partiram. A esperança cristã não nega a morte: contempla-a à luz de Cristo ressuscitado e confia os mortos ao amor e à justiça de Deus.','Rezarei especialmente pelos falecidos de minha família e pelos esquecidos.'],
['Da Polônia para o mundo','As almas tíbias e o mundo inteiro','Mc 16,15','O último dia se abre para o mundo. A mensagem confiada a uma religiosa simples atravessou Cracóvia, guerras, gerações e povos. Mas não termina em Faustina nem em João Paulo II: retorna a Cristo e nos envia a viver a misericórdia.','Rezarei o Terço por uma intenção universal e escolherei uma forma concreta de continuar vivendo a misericórdia.']];let cur=+(localStorage.dmDay||1);function render(){document.documentElement.style.setProperty('--day',cur);bar.style.width=(cur/9*100)+'%';days.innerHTML=D.map((x,i)=>`<button class="${i+1==cur?'active':''}" onclick="setDay(${i+1})">Dia ${i+1}</button>`).join('');let x=D[cur-1];content.innerHTML=`<div class="kicker" style="color:#8f1d25">DIA ${cur}</div><h2>${x[0]}</h2><div class="theme">${x[1]}</div><section class="section"><h3>Em nome do Pai</h3><p>Em nome do Pai, do Filho e do Espírito Santo. Amém.</p></section><section class="section"><h3>Invocação ao Espírito Santo</h3><p>Vinde, Espírito Santo, enchei os corações dos vossos fiéis e acendei neles o fogo do vosso amor. Enviai o vosso Espírito e tudo será criado, e renovareis a face da terra.</p></section><section class="section"><h3>Palavra de Deus</h3><p class="quote">${x[2]} — leia lentamente esta passagem e permaneça um instante em silêncio diante de Cristo.</p></section><section class="section"><h3>Intenção tradicional</h3><p>Hoje apresentamos a Jesus: <b>${x[1]}</b>. Unimo-nos à espiritualidade da novena transmitida por Santa Faustina, confiando esta intenção à insondável Misericórdia de Deus.</p></section><section class="section"><h3>Meditação</h3><p>${x[3]}</p></section><section class="section"><h3>Com Santa Faustina</h3><p class="quote">“Jesus, eu confio em Vós.” A cada dia, o Diário nos convida a substituir a autossuficiência pela confiança e a transformar a misericórdia recebida em misericórdia oferecida.</p></section><section class="section"><h3>Com São João Paulo II</h3><p>A Misericórdia pertence ao coração do Evangelho: Cristo revela o Pai rico em misericórdia e chama o homem a tornar-se, ele próprio, testemunha desse amor.</p></section><div class="refrain">Pela Sua dolorosa Paixão,<br>tende misericórdia de nós e do mundo inteiro.</div><section class="section chaplet"><h3>Terço da Divina Misericórdia</h3><ol><li>Sinal da Cruz. Reze um Pai-Nosso, uma Ave-Maria e o Creio.</li><li>Nas contas maiores: <b>Eterno Pai, eu Vos ofereço o Corpo e Sangue, Alma e Divindade de Vosso diletíssimo Filho, Nosso Senhor Jesus Cristo, em expiação dos nossos pecados e do mundo inteiro.</b></li><li>Nas dez contas menores: <b>Pela Sua dolorosa Paixão, tende misericórdia de nós e do mundo inteiro.</b></li><li>Ao final, três vezes: <b>Deus Santo, Deus Forte, Deus Imortal, tende piedade de nós e do mundo inteiro.</b></li></ol></section><section class="section"><h3>Para a nossa vida</h3><p>${x[4]}</p></section><section class="section"><h3>Oração final</h3><p>Jesus Misericordioso, recebei este dia de oração. Fazei-nos confiar em Vós, acolher a Vossa misericórdia e levá-la aos que encontrarmos. Amém.</p></section><div class="refrain">Jezu, ufam Tobie.<br><small>Jesus, eu confio em Vós.</small></div>`;document.querySelector('.active')?.scrollIntoView({inline:'center',block:'nearest'});localStorage.dmDay=cur}function setDay(n){cur=n;render();scrollTo({top:0,behavior:'smooth'})}function go(d){setDay(Math.min(9,Math.max(1,cur+d)))}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
