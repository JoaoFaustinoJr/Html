<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0d"><title>Atualizando Novena</title><style>html,body{margin:0;min-height:100%;background:#080a0d;color:#f3e6d4;font-family:Georgia,serif}main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box}div{max-width:360px}h1{color:#e9bd6c;font-size:1.65rem}p{line-height:1.55}.mark{font-size:38px;color:#b52332}</style></head><body><main><div><div class="mark">✦</div><h1>Atualizando a Novena</h1><p>Preparando a versão mais recente do aplicativo…</p></div></main><script>(async()=>{try{if('serviceWorker'in navigator){let rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){let ks=await caches.keys();await Promise.all(ks.filter(k=>k.indexOf('divina-misericordia')>=0).map(k=>caches.delete(k)))}sessionStorage.setItem('dmClean73','1')}catch(e){}location.replace('./?v=73&fresh='+Date.now())})()</script></body></html>
