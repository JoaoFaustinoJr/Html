<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07132f">
<meta name="description" content="Tia Tati Jovem – desafios terapêuticos de atenção, ritmo, memória, regulação e movimento.">
<title>Tia Tati Jovem – Fisio Sensorial</title>
<link rel="stylesheet" href="styles.css?v=j10">
<link rel="stylesheet" href="sensory-v40.css?v=j10">
<link rel="stylesheet" href="remaining-v41.css?v=j10">
<link rel="stylesheet" href="polish-v43.css?v=j10">
<link rel="stylesheet" href="jovem-v1.css?v=j10">
<style>
html,body{margin:0;min-height:100%;background:#07132f;color:#fff}
#j10Boot{position:fixed;z-index:999999;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#06132f,#16195a 58%,#301057);font:700 15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#eefcff;text-align:center;padding:24px}
#j10Boot .box{width:min(86vw,360px);padding:24px 20px;border:1px solid rgba(64,224,255,.35);border-radius:24px;background:rgba(9,20,58,.93);box-shadow:0 18px 55px rgba(0,0,0,.38)}
#j10Boot b{display:block;font-size:1.25rem;color:#45e8ff;margin-bottom:6px}#j10Boot small{display:block;color:#c8d5f4;margin-top:7px;font-weight:600}
html.j10-ready #j10Boot{display:none!important}
/* isolamento crítico: nada Kids aparece antes da camada Jovem terminar */
header.topbar,#bottomNav{display:none!important}
#screen-home>.home-v22-hero,
#screen-home>.audience-v44,
#screen-home>.kids-v44,
#screen-home>.home-v22-section-head,
#screen-home>.home-v22-missions,
#screen-home>.home-v22-autonomy,
#screen-home>.support-v44,
#screen-home>.home-v22-cards,
#screen-home>.home-v22-tools,
#screen-home>.finish-v44,
#screen-home>.home-v22-footer-phrase{display:none!important}
html:not(.j10-ready) #screen-home>.youth-challenges{visibility:hidden!important}
</style>
</head>
<body>
<div id="j10Boot"><div class="box"><b>⚡ Tia Tati Jovem</b><span id="j10Status">Preparando os seis desafios…</span><small>Entrada isolada • j10</small></div></div>
<div id="j10Mount"></div>
<script>
(async()=>{
  const status=document.getElementById('j10Status');
  const setStatus=t=>{if(status)status.textContent=t};
  const fail=err=>{
    console.error('Tia Tati Jovem j10',err);
    const boot=document.getElementById('j10Boot');
    if(boot)boot.innerHTML='<div class="box"><b>Não foi possível iniciar</b><span>'+String(err&&err.message||err)+'</span><small>Volte ao Portal Tia Tati e tente novamente.</small></div>';
  };
  const getText=async(url,label)=>{
    setStatus('Carregando '+label+'…');
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),12000);
    try{
      const r=await fetch(url+(url.includes('?')?'&':'?')+'j10='+Date.now(),{cache:'no-store',credentials:'same-origin',signal:ctrl.signal});
      if(!r.ok)throw new Error(label+': HTTP '+r.status);
      const t=await r.text();
      if(!t||t.length<80)throw new Error(label+': arquivo vazio ou incompleto');
      return t;
    }finally{clearTimeout(timer)}
  };
  const run=async(src,label)=>{
    const code=await getText(src,label);
    try{(0,eval)(code+'\n//# sourceURL='+src+'?j10');}
    catch(e){throw new Error(label+': '+e.message)}
  };
  try{
    /* O HTML-base é usado somente como molde. Scripts externos do molde não são importados. */
    const html=await getText('index.html?template=j10','estrutura');
    const doc=new DOMParser().parseFromString(html,'text/html');
    const sourceApp=doc.getElementById('app');
    if(!sourceApp)throw new Error('estrutura: #app não encontrado');
    const mount=document.getElementById('j10Mount');
    mount.replaceWith(document.importNode(sourceApp,true));

    /* Núcleo estável primeiro; extensões depois; apresentação Jovem por último. */
    await run('app-core-v39.js','motor principal');
    await run('sensory-v40.js','Pulse Lab');
    await run('remaining-v41.js','Recomeço e Move Quest');
    await run('naming-v42.js','nomes das atividades');
    await run('jovem-v1.js','home Jovem');

    document.documentElement.classList.add('j10-ready');
    window.dispatchEvent(new Event('tia:jovem-modules-ready'));
    setTimeout(()=>document.getElementById('j10Boot')?.remove(),250);
  }catch(err){fail(err)}
})();
</script>
</body>
</html>
