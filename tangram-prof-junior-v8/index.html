<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<title>Tangram Educativo — Prof. João Faustino Junior</title>
<meta name="description" content="Desafie sua lógica com geometria, estratégia e criatividade em missões interativas de Tangram.">

<meta property="og:image" content="https://joaofaustinojr.github.io/Html/tangram-prof-junior/tangram-card-v5.png">
<meta property="og:image:secure_url" content="https://joaofaustinojr.github.io/Html/tangram-prof-junior/tangram-card-v5.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tangram Educativo — Prof. João Faustino Junior">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tangram Educativo — Prof. João Faustino Junior">
<meta name="twitter:description" content="Desafie sua lógica! Geometria, estratégia e criatividade em missões interativas.">
<meta name="twitter:image" content="https://joaofaustinojr.github.io/Html/tangram-prof-junior/tangram-card-v5.png">
<link rel="icon" href="../tangram-prof-junior/icon.svg" type="image/svg+xml">
<style>html,body{margin:0;min-height:100%;background:#050f18;color:#eefaff;font-family:system-ui}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}</style>
</head>
<body>
<div id="loading"><div><h1>🧩 Tangram Educativo</h1><p>Carregando desafio...</p></div></div>
<script>
(async()=>{
 try{
  const files=['../tangram-prof-junior/chunk01.txt?v=8','../tangram-prof-junior/chunk02-03.txt?v=8','../tangram-prof-junior/chunk04-05.txt?v=8','../tangram-prof-junior/chunk06-07.txt?v=8','../tangram-prof-junior/chunk08-09.txt?v=8'];
  const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
  const b64=parts.join('').replace(/\s+/g,'');
  const bin=atob(b64);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  let page=new TextDecoder('utf-8').decode(bytes);

  // Segurança mobile: esta versão não usa fullscreen nativo nem rotação da tela.
  page=page.replace(/screen\.orientation\.lock\s*\([^;]*?\)/g,"Promise.resolve()");
  page=page.replace(/document\.exitFullscreen\s*\([^;]*?\)/g,"Promise.resolve()");

  page=page.replaceAll('Prof. Júnior','Prof. João Faustino Junior');
  page=page.replaceAll('Prof. Junior','Prof. João Faustino Junior');

  const raiImg='../tangram-prof-junior/rai-chalk.webp?v=8';
  page=page.replace(
    /<div class="tl-head">\s*<div><h1>.*?<\/h1><div class="tl-sub">.*?<\/div><\/div>/s,
    `<div class="tl-head"><div class="tl-brand"><img class="tl-rai-brand" src="${raiImg}" alt="R.A.I."><div><h1>🧩 Tangram Educativo</h1><div class="tl-sub">Prof. João Faustino Junior</div></div></div>`
  );

  const extraCss=`<style>
    .tl-brand{display:flex;align-items:center;gap:12px;min-width:0}
    .tl-rai-brand{width:74px;height:74px;object-fit:cover;border-radius:17px;border:1px solid #376b80;box-shadow:0 6px 16px rgba(0,0,0,.28);flex:0 0 auto}
    .tl-brand h1{margin:0}
    @media(max-width:640px){
      #tangram-levels{padding:7px!important}
      .tl-head{align-items:center!important;gap:8px!important}
      .tl-rai-brand{width:58px;height:58px;border-radius:14px}
      .tl-brand h1{font-size:19px!important;line-height:1.12}
      .tl-brand .tl-sub{font-size:12px!important}
      .tl-board-scroll{min-height:330px}
      .tl-mobile-controls{grid-template-columns:repeat(4,1fr)!important}
    }
    .tl-focus-back{display:none;position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:2147483647;border:1px solid #69e7ff;background:rgba(7,27,40,.96);color:#fff;border-radius:999px;padding:10px 14px;font:800 14px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.4);touch-action:manipulation}
    #tangram-levels.tl-focus{position:fixed!important;inset:0!important;z-index:2147483000!important;max-width:none!important;width:100vw!important;height:100dvh!important;min-height:100dvh!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#050f18!important;overflow:hidden!important}
    #tangram-levels.tl-focus .tl-focus-back{display:flex!important;align-items:center;gap:6px}
    #tangram-levels.tl-focus .tl-head,
    #tangram-levels.tl-focus .tl-side,
    #tangram-levels.tl-focus .tl-math,
    #tangram-levels.tl-focus .tl-legend,
    #tangram-levels.tl-focus .tl-toolbar,
    #tangram-levels.tl-focus .tl-meter,
    #tangram-levels.tl-focus .tl-metertext,
    #tangram-levels.tl-focus .tl-msg{display:none!important}
    #tangram-levels.tl-focus .tl-layout,
    #tangram-levels.tl-focus .tl-game{display:block!important;width:100%!important;height:100%!important}
    #tangram-levels.tl-focus .tl-stage{display:flex!important;flex-direction:column!important;width:100%!important;height:100dvh!important;border:0!important;border-radius:0!important;background:#050f18!important}
    #tangram-levels.tl-focus .tl-board-scroll{flex:1 1 auto!important;height:auto!important;min-height:0!important;width:100%!important;padding:42px 2px 4px!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;background:radial-gradient(circle at center,#0b2131,#050f18 72%)!important}
    #tangram-levels.tl-focus .tl-board-scroll svg{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;min-width:0!important;object-fit:contain!important}
    #tangram-levels.tl-focus .tl-mobile-controls{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:5px!important;flex:0 0 auto!important;position:relative!important;bottom:auto!important;z-index:20!important;padding:6px!important;background:#071824!important}
    #tangram-levels.tl-focus .tl-mobile-controls button{min-height:46px!important;padding:5px 2px!important}
  </style>`;
  page=page.replace('</head>',extraCss+'</head>');

  page=page.replace(
    '<button class="tl-btn" id="sample" type="button" style="width:100%;margin-top:8px">👁️ Amostra de solução</button>',
    '<button class="tl-btn" id="sample" type="button" style="width:100%;margin-top:8px">👁️ Amostra de solução</button><button class="tl-btn primary" id="focusZoom" type="button" style="width:100%;margin-top:8px">🔍 Ampliar área de jogo</button>'
  );
  page=page.replace(
    '<button type="button" id="mCheck" aria-label="Verificar encaixe">✓<span>Verificar</span></button>',
    '<button type="button" id="mFull" aria-label="Ampliar área de jogo">🔍<span>Ampliar</span></button><button type="button" id="mCheck" aria-label="Verificar encaixe">✓<span>Verificar</span></button>'
  );

  const focusScript=`<script>
  (()=>{
    const root=document.getElementById('tangram-levels');
    const buttons=[document.getElementById('focusZoom'),document.getElementById('mFull')].filter(Boolean);
    if(!root||!buttons.length)return;
    const back=document.createElement('button');
    back.type='button';
    back.className='tl-focus-back';
    back.setAttribute('aria-label','Voltar ao aplicativo');
    back.innerHTML='← <span>Voltar</span>';
    back.title='Voltar ao aplicativo';
    root.appendChild(back);
    let savedY=0;
    const update=()=>{
      const on=root.classList.contains('tl-focus');
      const a=document.getElementById('focusZoom');
      const b=document.getElementById('mFull');
      if(a)a.textContent=on?'← Voltar ao app':'🔍 Ampliar área de jogo';
      if(b)b.innerHTML=on?'←<span>Voltar</span>':'🔍<span>Ampliar</span>';
    };
    const enter=()=>{
      if(root.classList.contains('tl-focus'))return;
      savedY=window.scrollY||0;
      root.classList.add('tl-focus');
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
      update();
    };
    const exit=()=>{
      if(!root.classList.contains('tl-focus'))return;
      root.classList.remove('tl-focus');
      document.documentElement.style.overflow='';
      document.body.style.overflow='';
      update();
      requestAnimationFrame(()=>window.scrollTo(0,savedY));
    };
    const toggle=()=>root.classList.contains('tl-focus')?exit():enter();
    buttons.forEach(b=>b.addEventListener('click',toggle));
    back.addEventListener('click',exit);
    document.addEventListener('keydown',e=>{if(e.key==='Escape')exit()});
    update();
  })();
  <\/script>`;

  page=page.replace('</body>',focusScript+'</body>');
  document.open();document.write(page);document.close();
 }catch(e){document.getElementById('loading').innerHTML='<div><h1>🧩 Tangram Educativo</h1><p>Não foi possível carregar o jogo. Atualize a página.</p></div>'}
})();
</script>
</body>
</html>
