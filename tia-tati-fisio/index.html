<style>html,body{margin:0;min-height:100%;background:#f8fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.recover{min-height:100vh;display:grid;place-items:center;text-align:center;color:#164b87;background:linear-gradient(135deg,#fff8fc,#eefaff)}.recover div{display:grid;gap:9px;place-items:center;padding:24px}.recover b{font-size:44px}.recover strong{font-size:19px}.recover small{color:#71849a}</style>

<body>
<div class="recover"><div><b>💗</b><strong>Tia Tati – Fisio Sensorial</strong><small>Restaurando o aplicativo integrado…</small></div></div>
<script>
(async()=>{
 try{
  if(localStorage.getItem('tiaTatiV60Repair')!=='1'){
   if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
   }
   if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.map(k=>caches.delete(k)));
   }
   localStorage.setItem('tiaTatiV60Repair','1');
  }
 }catch(_){ }
 location.replace('./activity.html?v=60&t='+Date.now());
})();
</script>
</body>
</html>
