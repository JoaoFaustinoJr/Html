<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>Tia Tati – Atividade</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#activityFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f8fbff;opacity:0;transition:opacity .12s ease}
#activityFrame.ready{opacity:1}
#boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:linear-gradient(135deg,#fff8fc,#eefaff);color:#164b87;text-align:center}
#boot.hide{display:none}
#boot div{display:grid;gap:9px;place-items:center;padding:24px}#boot b{font-size:42px}#boot strong{font-size:18px}#boot small{color:#71849a}
#error{display:none;max-width:300px;line-height:1.4}#error a{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:999px;background:#ff4fa3;color:white;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div id="boot"><div><b>💗</b><strong>Abrindo sua atividade…</strong><small>Tia Tati • Fisio Sensorial</small><div id="error">Não consegui localizar essa atividade.<br><a href="./?v=56">Voltar ao início</a></div></div></div>
<iframe id="activityFrame" title="Atividade Tia Tati" src="about:blank"></iframe>
<script>
(()=>{
'use strict';
const params=new URLSearchParams(location.search);
const key=params.get('open')||'road';
const frame=document.getElementById('activityFrame');
const boot=document.getElementById('boot');
const error=document.getElementById('error');
const src=new URL('./activity.html',location.href);
src.searchParams.set('shell','56');
src.searchParams.set('t',Date.now().toString());
frame.src=src.href;

const direct={
 road:'[data-mission="road"]',bee:'[data-mission="bee"]',target:'[data-mission="target"]',hands:'[data-mission="hands"]',
 sensory:'[data-mission="sensory"]',breathe:'[data-mission="breathe"]',
 react:'[data-youth-light="react"]',memory:'[data-youth-light="memory"]',beat:'[data-youth-light="beat"]',
 pulse:'[data-youth-sensory="pulse"]',restart:'[data-youth-breathe="reset"]',movequest:'[data-youth-physical="quest"]',
 circuit:'#circuitBtn',voice:'#voiceStudioBtn',reports:'#reportsBtn',fisio:'#settingsTopBtn',interventions:'#interventionsBtn'
};

function hookHome(doc){
 doc.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-home],#homeBrand,[data-nav="home"],.sensory-v40-home,.v41-breathe-home,.v41-physical-home');
  if(!el)return;
  ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();
  top.location.href='./?v=56&t='+Date.now();
 },true);
}

function visibleAwayFromHome(doc){
 const h=doc.querySelector('#screen-home');
 return !h || !h.classList.contains('active');
}

function click(doc,sel){
 const el=doc.querySelector(sel);
 if(!el)return false;
 el.click();
 return true;
}

function route(doc){
 const sel=direct[key];
 if(sel && click(doc,sel))return true;

 // Fallbacks das atividades jovens adicionadas por módulos posteriores.
 if(key==='pulse'){
  const base=doc.querySelector('[data-mission="sensory"]');
  if(base){base.click();return true;}
 }
 if(key==='restart'){
  const base=doc.querySelector('[data-mission="breathe"]');
  if(base){base.click();return true;}
 }
 if(key==='movequest'){
  const base=doc.querySelector('[data-mission="physical"]');
  if(base){base.click();return true;}
 }
 if(['react','memory','beat'].includes(key)){
  const base=doc.querySelector('[data-mission="light"]');
  if(base){base.click();setTimeout(()=>doc.querySelector('[data-light-mode="'+key+'"]')?.click(),80);return true;}
 }
 return false;
}

frame.addEventListener('load',()=>{
 let doc;
 try{doc=frame.contentDocument||frame.contentWindow.document;}catch(_){showError();return;}
 hookHome(doc);
 let attempts=0;
 const timer=setInterval(()=>{
  attempts++;
  let ok=false;
  try{ok=route(doc);}catch(_){ }
  if(ok){
   setTimeout(()=>{
    frame.classList.add('ready');boot.classList.add('hide');
    try{frame.contentWindow.scrollTo(0,0);}catch(_){ }
   },100);
   clearInterval(timer);
   return;
  }
  if(attempts>=30){clearInterval(timer);showError();}
 },100);
});

function showError(){
 frame.classList.remove('ready');
 error.style.display='block';
 boot.classList.remove('hide');
}
})();
</script>
</body>
</html>
