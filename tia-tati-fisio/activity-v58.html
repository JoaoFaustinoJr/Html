<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>Tia Tati – Atividade</title>
<style>
html,body{margin:0;min-height:100%;background:#f8fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#tt58boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:linear-gradient(135deg,#fff8fc,#eefaff);color:#164b87;text-align:center}
#tt58boot.hide{display:none}#tt58boot>div{display:grid;gap:9px;place-items:center;padding:24px}#tt58boot b{font-size:42px}#tt58boot strong{font-size:19px}#tt58boot small{color:#71849a}#tt58error{display:none;max-width:330px;line-height:1.45;margin-top:12px}#tt58error a{display:inline-block;margin-top:12px;padding:11px 18px;border-radius:999px;background:#ff4fa3;color:#fff;text-decoration:none;font-weight:850}
#tt58mount{opacity:0;transition:opacity .1s ease}#tt58mount.ready{opacity:1}
</style>
</head>
<body>
<div id="tt58boot"><div><b>💗</b><strong>Abrindo sua atividade…</strong><small>Tia Tati • Fisio Sensorial</small><div id="tt58error">Não foi possível preparar a atividade.<br><a href="./?v=58">Voltar ao início</a></div></div></div>
<div id="tt58mount"></div>
<script>
(async()=>{
'use strict';
const V='58';
const key=new URLSearchParams(location.search).get('open')||'road';
const mount=document.getElementById('tt58mount');
const boot=document.getElementById('tt58boot');
const error=document.getElementById('tt58error');
const nonce=Date.now();
let revealed=false;

function css(href){const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l);}
function script(src){return new Promise((resolve)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>resolve();document.head.appendChild(s);});}
function screensOff(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));}
function activate(id){
 const target=document.getElementById('screen-'+id);
 if(!target)return false;
 screensOff();target.classList.add('active');
 const app=document.getElementById('app');
 if(app){
  app.classList.toggle('road-setup-mode',id==='roadsetup');
  app.classList.toggle('bee-setup-mode',id==='beesetup');
  app.classList.toggle('target-setup-mode',id==='targetsetup');
  app.classList.toggle('hands-setup-mode',id==='handssetup');
  app.classList.toggle('light-setup-mode',id==='lightsetup');
 }
 document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.remove('active'));
 window.scrollTo({top:0,left:0,behavior:'auto'});
 return true;
}
function reveal(){if(revealed)return;revealed=true;mount.classList.add('ready');boot.classList.add('hide');window.scrollTo(0,0);}
function fail(msg){console.error('[Tia Tati v58]',msg);error.style.display='block';}

const basic={road:'roadsetup',bee:'beesetup',target:'targetsetup',hands:'handssetup',react:'lightsetup',memory:'lightsetup',beat:'lightsetup',circuit:'circuit',voice:'voice',reports:'reports',fisio:'fisio',interventions:'interventions'};
const dynamic={sensory:'sensorysetup',pulse:'sensorysetup',breathe:'breathesetup',restart:'breathesetup',movequest:'physicalsetup'};
function chooseVariant(){
 try{
  if(['react','memory','beat'].includes(key))document.querySelector(`[data-light-mode="${key}"]`)?.click();
  if(key==='pulse')document.querySelector('[data-sensory-profile="pulse"]')?.click();
  if(key==='restart')document.querySelector('[data-breathe-mode="reset"]')?.click();
  if(key==='movequest')document.querySelector('[data-physical-profile="quest"]')?.click();
 }catch(_){ }
}
function route(){
 const id=basic[key]||dynamic[key];
 if(!id)return false;
 if(!activate(id))return false;
 setTimeout(chooseVariant,30);
 return true;
}

try{
 const u=new URL('./activity.html',location.href);u.searchParams.set('raw','58');u.searchParams.set('t',nonce);
 const r=await fetch(u.href,{cache:'no-store'});if(!r.ok)throw new Error('activity.html '+r.status);
 const text=await r.text();
 const doc=new DOMParser().parseFromString(text,'text/html');
 doc.querySelectorAll('script').forEach(s=>s.remove());
 mount.innerHTML=doc.body.innerHTML;
 css('./styles.css?v=58&t='+nonce);

 // Carregamento explícito e sequencial: nenhuma camada de loader intermediária.
 const modules=['app-base-v39.js','sensory-v40.js','remaining-v41.js','naming-v42.js','final-v44.js','identity-v45.js'];
 for(const m of modules)await script('./'+m+'?v=58&t='+nonce);

 // As telas básicas já existem no HTML; as sensoriais/respiração/físicas são criadas pelos módulos acima.
 let tries=0;
 const timer=setInterval(()=>{
  tries++;
  if(route()){
   clearInterval(timer);
   setTimeout(reveal,70);
   return;
  }
  if(tries>=35){clearInterval(timer);fail('Tela de destino não encontrada: '+key);}
 },60);

 // Retorno sempre para a home nova.
 document.addEventListener('click',e=>{
  const h=e.target.closest('[data-home],#homeBrand,[data-nav="home"],.sensory-v40-home,.v41-breathe-home,.v41-physical-home');
  if(!h)return;
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();location.href='./?v=58&t='+Date.now();
 },true);
}catch(err){fail(err&&err.message?err.message:String(err));}
})();
</script>
</body>
</html>
