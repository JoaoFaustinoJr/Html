<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>Tia Tati – Abrindo atividade</title>
<style>
html,body{margin:0;min-height:100%;background:#f8fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;color:#164b87;background:linear-gradient(135deg,#fff8fc,#eefaff)}.boot div{display:grid;gap:10px;place-items:center}.boot span{font-size:44px}.boot strong{font-size:18px}.boot small{color:#71849a}
</style>
</head>
<body>
<div class="boot"><div><span>💗</span><strong>Abrindo sua atividade…</strong><small>Tia Tati • Fisio Sensorial</small></div></div>
<script>
(async()=>{
 const p=new URLSearchParams(location.search);
 const open=p.get('open')||'road';
 // Atualiza o carregador principal antes de entrar na activity.html,
 // evitando que o navegador reutilize uma versão antiga de app.js?v=39.
 try{await fetch('./app.js?v=39',{cache:'reload'});}catch(_){ }
 try{await fetch('./direct-route-v54.js?v=54',{cache:'reload'});}catch(_){ }
 const target=new URL('./activity.html',location.href);
 target.searchParams.set('open',open);
 target.searchParams.set('v','55');
 target.searchParams.set('t',Date.now().toString());
 location.replace(target.href);
})();
</script>
</body>
</html>
